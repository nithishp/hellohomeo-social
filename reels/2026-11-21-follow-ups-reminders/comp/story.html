<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:Poppins;font-weight:500;src:url(fonts/poppins-latin-500-normal.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:#070C1F;font-family:Poppins;color:#fff;position:relative}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(95,214,172,.10) 2px,transparent 2.5px);background-size:48px 48px}
.logo{position:absolute;left:80px;top:270px;height:64px}
.tag{position:absolute;left:80px;top:370px;font-size:30px;font-weight:600;letter-spacing:2.5px;color:#5FD6AC;border:2px solid rgba(95,214,172,.45);background:rgba(16,184,128,.10);border-radius:999px;padding:10px 26px}
.ph{position:absolute;left:278px;top:470px;width:524px;height:932px;border-radius:56px;border:10px solid #1C2740;overflow:hidden;transform:rotate(-4deg);box-shadow:0 60px 120px -40px rgba(16,184,128,.35)}
.ph img{width:100%;height:100%;display:block}
.play{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:rgba(16,184,128,.92);display:flex;align-items:center;justify-content:center}
.t{position:absolute;left:80px;right:80px;top:1435px;font-family:Inter;font-weight:800;font-size:60px;line-height:1.08;letter-spacing:-1.5px;text-align:center}
.t span{color:#10B880}
</style></head><body><div id="dots"></div>
<img class="logo" src="logo-dark.svg" style="height:64px">
<div class="tag">NEW REEL ON OUR PROFILE</div>
<div class="ph"><img src="story_frame.png"><div class="play"><svg width="64" height="64" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></div></div>
<div class="t">Book the follow-up once.<br><span>WhatsApp reminders go out.</span></div>
</body></html>
